name: Build Firmware

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Compile firmware
      run: |
        chmod +x compile-with-docker.sh
        ./compile-with-docker.sh

    - name: Upload firmware artifact
      uses: actions/upload-artifact@v4
      with:
        name: kleanfw-firmware
        path: |
          build/Fusion/kleanfw.bin
          build/Fusion/kleanfw.hex
          build/Fusion/kleanfw.elf
